
name: Add CHANGELOG link to release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release-description:
    runs-on: ubuntu-latest

    steps:
      - name: Add CHANGELOG link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: repository } =
              await github.rest.repos.get({ owner, repo });

            const changelogUrl =
              `${repository.html_url}/blob/${repository.default_branch}/CHANGELOG.md`;

            const body =
              `## 변경 내역\n\n` +
              `[CHANGELOG.md](${changelogUrl})\n\n` + 
              `### 선택 사항\n\n` + 
              `60fps 치트 코드`;

            let releases;

            if (context.eventName === 'workflow_dispatch') {
              releases = await github.paginate(
                github.rest.repos.listReleases,
                { owner, repo, per_page: 100 }
              );
            } else {
              releases = [context.payload.release];
            }

            for (const release of releases) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                body
              });
            }
