
name: Add CHANGELOG link to release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-release-description:
    runs-on: ubuntu-latest

    steps:
      - name: Add CHANGELOG link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            const { data: repository } =
              await github.rest.repos.get({ owner, repo });

            let release = context.payload.release;

            if (!release) {
              const result =
                await github.rest.repos.getLatestRelease({ owner, repo });
              release = result.data;
            }

            const changelogUrl =
              `${repository.html_url}/blob/${repository.default_branch}/CHANGELOG.md`;

            const body =
              `## 변경 내역\n\n` +
              `[CHANGELOG.md](${changelogUrl})`;

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              body
            });
