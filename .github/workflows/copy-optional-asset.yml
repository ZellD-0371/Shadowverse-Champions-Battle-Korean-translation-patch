
name: Copy optional asset to new releases

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  copy-optional-asset:
    runs-on: ubuntu-latest

    steps:
      - name: Download optional file from v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSET_NAME: "60fps.zip"
        run: |
          mkdir -p optional-assets

          gh release download v1.0.0 \
            --pattern "$ASSET_NAME" \
            --dir optional-assets

          test -f "optional-assets/$ASSET_NAME"

      - name: Upload optional file to new release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ASSET_NAME: "60fps.zip"
        run: |
          gh release upload "$RELEASE_TAG" \
            "optional-assets/$ASSET_NAME" \
            --clobber
